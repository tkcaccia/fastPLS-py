name: Lean formal invariants

on:
  push:
    branches: [main]
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  pull_request:
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: FastPLSFormal
